# The TRELLIS desktop interface (ADR 0048).
#
# Its own workspace, as fuzz/ is, so the root workspace and the root
# Cargo.lock the dependency audit measured never see what it depends on
# (ADR 0048 section 1). It depends on no trellis crate: it reaches trellis
# only by spawning the binary (section 2), so it cannot become a second path
# to a verdict. Every cargo command on it takes --locked.
[package]
name = "trellis-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Caret requirements, as at the root; the committed Cargo.lock is the pin
# and desktop/deny.toml audits it as resolved, so a Tauri update is its own
# lock commit that passes cargo deny and cargo audit. tauri 2.12 and
# tauri-build 2.7 are the newest 2.x lines whose rust-version (1.90) the
# pinned toolchain (1.93) meets; 3.0 needs 1.95.
[dependencies]
tauri = "2.12"
serde = "1"
serde_json = "1"

[build-dependencies]
tauri-build = "2.7"

[lints.rust]
unsafe_code = "forbid"

[workspace]

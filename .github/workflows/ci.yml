name: CI

# v1.0 gate condition 4 is "induced mid-run failure returns the repo to its
# exact pre-run state, verified in CI". The test existed before this file did;
# the gate asks for it to run somewhere other than the author's machine, which
# is the part that makes it evidence.

on:
  # A PR branch runs once per push, through `pull_request`. Pushing on every
  # branch as well ran the whole suite twice for the same commit (#156).
  push:
    branches: ["v0.1-resolver"]
  pull_request:

# A newer push to the same ref makes the older run's result moot; cancelling
# it saves the minutes, which ran out on 2026-09-28 (#156).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Self-hosted when the repository variables name runners (JSON label
    # lists, e.g. ["self-hosted","Windows"]); GitHub-hosted when unset (#157).
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || '"windows-latest"') || (vars.LINUX_RUNNER || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@v4

      # The index asserts byte spans. Windows git rewrites line endings on
      # checkout by default, which makes those assertions platform-dependent
      # for reasons that have nothing to do with the code (A-21).
      - name: Pin line endings
        run: git config --global core.autocrlf false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # `hosted` (TLS) is a default feature of trellis-cli (ADR 0024 §1), so
  # every other job builds with it on. This one turns it off, so a change
  # that only compiles with TLS present fails here instead of in the hands
  # of whoever builds the local-only binary.
  local-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || '"windows-latest"') || (vars.LINUX_RUNNER || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@v4

      # Same reason as the `test` job: the index's byte-span assertions
      # depend on the checkout keeping LF line endings (A-21).
      - name: Pin line endings
        run: git config --global core.autocrlf false

      - uses: dtolnay/rust-toolchain@stable
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      - name: Build without default features
        run: cargo build -p trellis-cli --no-default-features

      - name: Test without default features
        run: cargo test -p trellis-cli --no-default-features

  # Called out as its own job so a failure names the gate condition rather
  # than appearing as one line in a list of 100 passing tests.
  rollback-gate:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      - name: Git identity for the test fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      - name: v1.0 condition 4 - rollback at every injection point
        run: |
          cargo test -p trellis-vcs -- --nocapture             rollback_after_an_induced_panic_returns_the_repo_to_its_prior_state             rollback_restores_tracked_edits_and_removes_new_files             rollback_is_idempotent             rollback_mid_edit_between_two_writes             rollback_after_a_killed_check_subprocess             rollback_after_checks_pass_but_before_approval             rollback_still_restores_when_the_trail_write_fails             a_rollback_that_fails_is_loud_and_leaves_a_manual_path

      - name: v1.0 condition 4 - a dead orchestrator writes nothing and stops
        run: |
          cargo test -p trellis-loop -- --nocapture             a_dead_orchestrator_stops_the_run_instead_of_spending_the_budget

      - name: v1.0 condition 4 - what an interrupt does, without the signal
        run: cargo test -p trellis-cli -- --nocapture interrupt_tests

      # The one injection point no unit test reaches: a real SIGINT delivered
      # to a real process mid-run. Linux only - MSYS `kill -INT` raises no
      # console Ctrl-C event for a native binary, so on Windows this would
      # pass by never testing anything.
      - name: v1.0 condition 4 - SIGINT mid-run, for real
        run: |
          cargo build --release -p trellis-cli
          bash docs/bench/interrupt_test.sh "$PWD/target/release/trellis"

  # The owner's deterministic guard suite (qa/run-guards.py, 11 cases), on a
  # machine that is not the owner's. The fixture is the trellis-demo history
  # vendored as qa/fixtures/trellis-demo.bundle; the runner clones it into a
  # temporary directory. No model is involved: every guard either uses a
  # scripted model or is refused before one is called.
  guards:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # The fixture's `.trellis/config.toml` runs `python -m mypy` and
      # `python -m pytest`. Pinned to the versions the suite last held 11/11
      # with on the owner's machine, so a tool release cannot move a guard.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixture checks (mypy, pytest; pinned)
        run: python -m pip install mypy==2.3.1 pytest==9.1.1

      - name: No machine-specific paths under qa/, bundle verifies
        run: bash scripts/checks/qa-portable.sh

      # history/TRELLIS-direction.md keeps a skill at 500 lines or fewer; this
      # holds the repository's own committed SKILL.md files to it (ADR 0019).
      # The self-test runs first so a check that cannot fail cannot pass.
      - name: No committed SKILL.md over 500 lines
        run: |
          bash scripts/checks/skill-lines.sh --self-test
          bash scripts/checks/skill-lines.sh

      - name: Build trellis-cli
        run: cargo build -p trellis-cli

      # `dirty_worktree` must be refused for its dirty tree, not for an
      # unreachable runtime, and reachability is only a TCP connect
      # (RuntimeClient::reachable). A plain listener on the fixture's runtime
      # port is enough. It is not Ollama, which is why this runs the suite
      # directly rather than through scripts/gates/guards.sh, whose
      # `/api/tags` probe it would fail. Started in this step so it is alive
      # for the whole run; it serves an empty directory.
      - name: Guard suite (every guard must hold)
        run: |
          python3 -m http.server 11434 --bind 127.0.0.1 --directory "$(mktemp -d)" >/dev/null 2>&1 &
          python3 - <<'EOF'
          import socket, sys, time
          for _ in range(50):
              try:
                  socket.create_connection(("127.0.0.1", 11434), timeout=1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          sys.exit("no listener on 127.0.0.1:11434 after 10s")
          EOF
          export PATH="$PWD/target/debug:$PATH"
          python3 qa/run-guards.py

  # Supply chain: licences, bans, sources and advisories against `deny.toml`,
  # then the RustSec database again through cargo-audit. Its own job so a new
  # advisory reads as a supply-chain failure, not as a broken build.
  supply-chain:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Caches ~/.cargo/bin, so the pinned tools are not recompiled per run.
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # Pinned so a new tool release cannot change what passes: these are the
      # versions the checks were last run with locally. RUSTFLAGS is cleared
      # for this step only: the workflow-wide `-D warnings` is for trellis's
      # code, and applying it to the tools' dependency tree would fail the
      # install on a lint in code this repository does not own.
      - name: Install cargo-deny and cargo-audit (pinned)
        env:
          RUSTFLAGS: ""
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2

      # Fails on any advisory not listed, with its reason, in `deny.toml`.
      - name: Licences, bans, sources, advisories
        run: cargo deny check

      # cargo-audit does not read `deny.toml`. It exits non-zero on a
      # vulnerability and reports unmaintained crates as warnings, which is
      # how RUSTSEC-2023-0089 (accepted in `deny.toml`) passes here without a
      # second ignore list.
      - name: RustSec advisories
        run: cargo audit

  # The graph's two structural guarantees, likewise named so a regression is
  # legible without reading the log.
  index-invariants:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      - name: Bidirectionality of forward/reverse adjacency
        run: cargo test -p trellis-index --test bidirectional

      - name: Resolver rules, soundness cases first
        run: cargo test -p trellis-index --test resolve_rules

      - name: Partition disjointness invariant (S19)
        run: cargo test -p trellis-loop --test partition_invariants

      # tree-sitter and its grammar share a C ABI and fail at runtime, not at
      # compile time, when mismatched. This turns that into a test failure.
      - name: Grammar/library ABI pairing
        run: cargo test -p trellis-index --test grammar_abi

  # v1.0 gate conditions 1 and 2, against the benchmark corpus itself.
  #
  # `04-v1.0-harness.md` names the failure this exists to prevent: recall
  # drifts down because months of resolver changes optimise for the cases
  # being looked at, and the benchmark was only ever run once, at the start.
  #
  # The corpus is fetched by the SHA-256 recorded in `01-v0.1-measure.md`, so
  # a different sdist fails here rather than quietly moving every figure in
  # the documents.
  precision-gate:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      - name: Fetch the benchmark corpus at its recorded hash
        run: |
          mkdir -p .bench
          curl -sSL -o .bench/poetry-2.5.0.tar.gz             https://files.pythonhosted.org/packages/source/p/poetry/poetry-2.5.0.tar.gz
          echo "e73b873890526c03e4d8e20d934292175f55a5823b3bdee2f154f63dae81336f  .bench/poetry-2.5.0.tar.gz"             | sha256sum -c -
          tar -xzf .bench/poetry-2.5.0.tar.gz -C .bench

      # Condition 2, first half: no Resolved edge names a symbol the source
      # did not call. Exits non-zero on any violation.
      - name: v1.0 condition 2 — every Resolved edge names what was called
        run: |
          cargo run --release -p trellis-index --example check_soundness             -- .bench/poetry-2.5.0

      # Condition 2, second half: every cross-file Resolved edge has an import
      # path, or a verified inheritance chain, actually connecting it. This is
      # the check that reaches "the wrong `foo` in another module", which the
      # name check explicitly cannot.
      - name: v1.0 condition 2 — every cross-file edge is reachable
        run: |
          cargo run --release -p trellis-index --example check_reachability             -- .bench/poetry-2.5.0

      # Condition 1. The resolver's verdicts are REGENERATED here and scored
      # against the committed human judgements. Scoring the stored pair would
      # replay history and pass forever — which is exactly how the committed
      # seed-20260919 verdicts went stale at 47.8% while every document said
      # 67.9%. The seed reproduces the sites; only the verdicts are recomputed.
      - name: v1.0 condition 1 — recall has not regressed
        run: |
          set -e
          for seed in "20260919 400 67.9" "20260920 300 72.0"; do
            set -- $seed
            dir="docs/bench/poetry-2.5.0-seed$1"
            out=".bench/regen-$1"
            cargo run --release -p trellis-index --example audit_sample               -- .bench/poetry-2.5.0 "$2" "$1" "$out"
            # The human judgements are the truth and are never regenerated.
            cp "$dir/sample.json" "$out/sample.json"
            cargo run --release -p trellis-index --example audit_score               -- "$out" --min-recall "$3" --min-precision 100.0
          done

name: CI

# v1.0 gate condition 4 is "induced mid-run failure returns the repo to its
# exact pre-run state, verified in CI". The test existed before this file did;
# the gate asks for it to run somewhere other than the author's machine, which
# is the part that makes it evidence.

on:
  # Each commit runs once. Pushing on every branch as well as on every pull
  # request ran the whole suite twice for the same commit (#156); listing
  # `audit` and every PR target ran it four times (#381). A pull request runs
  # into `dev` and `main`: those are the two promotions on the way to `main`
  # (`audit` into `dev`, `dev` into `main`), and each is checked here before
  # it merges (#426). A push runs on `main` only. `audit` and `dev` are left
  # out because the `audit` -> `dev` pull request has already run CI on the
  # tree `dev` receives, and the `dev` -> `main` pull request runs it again; a
  # run on the `dev` push only repeated that, and when it was cancelled GitHub
  # showed it as failed checks on the `dev` -> `main` pull request (#473, #477).
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]

# A newer push to the same ref makes the older run's result moot; cancelling
# it saves the minutes, which ran out on 2026-09-28 (#156).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared rather than inherited: the repository default is already
# read-only, but a workflow that does not say so is widened silently by a
# change to that setting. No job here writes to the repository (#215).
permissions:
  contents: read

# Every action below is pinned to a commit SHA resolved from its tag through
# the GitHub API, with the tag in a comment; a tag can be moved, a SHA
# cannot. Every checkout sets `persist-credentials: false`, so the job's
# token is not left in .git/config for the code under test to read, and
# every cargo build/test/clippy/run passes --locked, so CI builds the
# versions Cargo.lock records instead of resolving new ones (#215, audit T1).
# G5 holds both: zizmor over this directory, and
# scripts/checks/workflows-locked.sh.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Self-hosted when the repository variables name runners (JSON label
    # lists, e.g. ["self-hosted","Windows"]); GitHub-hosted when unset (#157).
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || '"windows-latest"') || (vars.LINUX_RUNNER || '"ubuntu-latest"')) }}
    # Every job names a ceiling. Without one a job on an offline or stuck
    # runner waits GitHub's default 360 minutes, on a plan whose minutes ran
    # out once already (#156, #381). Test jobs get 45, the supply-chain job
    # 30 (it compiles two pinned tools on a cold cache), and
    # scripts/checks/ci-timeouts.sh fails on a job that names none.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The index asserts byte spans. Windows git rewrites line endings on
      # checkout by default, which makes those assertions platform-dependent
      # for reasons that have nothing to do with the code (A-21).
      - name: Pin line endings
        run: git config --global core.autocrlf false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

  # desktop/ is its own Cargo workspace with its own lock (ADR 0048), so
  # nothing in `test` builds, lints or tests it (#384). Both platforms, as
  # `test` runs: the binary its tests spawn is `trellis.exe` on Windows and
  # `trellis` on Linux, and the Tauri shell (#289) builds against WebView2
  # and MSVC on Windows and WebKitGTK on Linux (#297).
  #
  # Tauri's Linux prerequisites are the runner's, not this job's: the owner
  # installs them as root on the self-hosted runner, and the job never runs
  # apt there (owner decision 2026-10-06). It checks for them instead.
  #
  # A cold Tauri build is long, and both self-hosted runners share one host,
  # so the job builds on two jobs and is given 120 minutes (#289).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || '"windows-latest"') || (vars.LINUX_RUNNER || '"ubuntu-latest"')) }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: WebKitGTK present (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists webkit2gtk-4.1; then
            echo "::error::webkit2gtk-4.1 not found: install libwebkit2gtk-4.1-dev, libxdo-dev and pkg-config on this runner (as root, once; this job never runs apt)"
            exit 1
          fi

      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      # Keyed on desktop/'s own target directory and lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: desktop

      # The desktop's tests spawn `target/debug/trellis` (desktop/src/child.rs),
      # so it is built first; without it the test fails asking for it (#426).
      - name: Build trellis (the desktop's tests spawn it)
        run: cargo build --locked -p trellis-cli

      - name: Format (desktop/)
        run: cargo fmt --check --manifest-path desktop/Cargo.toml

      - name: Clippy (desktop/)
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Build (desktop/)
        run: cargo build --locked --manifest-path desktop/Cargo.toml

      - name: Test (desktop/)
        run: cargo test --locked --manifest-path desktop/Cargo.toml

      # The guard the supply-chain job runs on Linux, here on Windows too.
      # `shell: bash` is Git Bash on Windows; a bare `bash` from the default
      # pwsh can resolve to WSL's System32\bash.exe instead.
      - name: Desktop guards (ADR 0048)
        shell: bash
        run: |
          scripts/checks/desktop-guards.sh --self-test
          scripts/checks/desktop-guards.sh

  # The Go TUI, tui/ (ADR 0052 section 6, #505), on both self-hosted
  # runners. Go comes from the runner's own pinned install
  # (scripts/runners/install-go.sh, #503), never actions/setup-go: the job
  # checks `go version` names the pin before anything runs. GOFLAGS keeps
  # go.sum the pin, and GOTOOLCHAIN=local stops go.mod's toolchain line from
  # downloading another toolchain (decision 2.4). The rpc tests spawn
  # target/debug/trellis, so it is built first, as the desktop job does.
  # `-race` needs cgo, so it runs on Linux only, and only where a C compiler
  # lets CGO_ENABLED be 1 (section 5).
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || '"windows-latest"') || (vars.LINUX_RUNNER || '"ubuntu-latest"')) }}
    timeout-minutes: 45
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"

      - name: Go is the pinned toolchain (scripts/runners/install-go.sh)
        shell: bash
        run: |
          v=$(go version)
          echo "$v"
          case "$v" in
            "go version go1.27.2 "*) ;;
            *) echo "::error::expected go1.27.2, the pin in scripts/runners/install-go.sh; run it on this runner (docs/BUILD_SYSTEM.md, Go on the runners)"; exit 1 ;;
          esac

      - name: Build trellis (the rpc tests spawn it)
        run: cargo build --locked -p trellis-cli

      - name: Go checks (tui/)
        shell: bash
        run: |
          scripts/checks/go-test.sh --self-test
          scripts/checks/go-test.sh

      - name: Race detector (Linux, with cgo)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v gcc >/dev/null 2>&1 && [ "$(CGO_ENABLED=1 go env CGO_ENABLED)" = 1 ]; then
            cd tui && CGO_ENABLED=1 go test -mod=readonly -race -count=1 ./...
          else
            echo "no C compiler on this runner, so cgo cannot be enabled; -race not run (ADR 0052 section 5)"
          fi

  # `hosted` (TLS) is a default feature of trellis-cli (ADR 0024 §1), so
  # every other job builds with it on. This one turns it off, so a change
  # that only compiles with TLS present fails here instead of in the hands
  # of whoever builds the local-only binary.
  local-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || '"windows-latest"') || (vars.LINUX_RUNNER || '"ubuntu-latest"')) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Same reason as the `test` job: the index's byte-span assertions
      # depend on the checkout keeping LF line endings (A-21).
      - name: Pin line endings
        run: git config --global core.autocrlf false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      - name: Build without default features
        run: cargo build --locked -p trellis-cli --no-default-features

      - name: Test without default features
        run: cargo test --locked -p trellis-cli --no-default-features

  # Called out as its own job so a failure names the gate condition rather
  # than appearing as one line in a list of 100 passing tests.
  rollback-gate:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      - name: Git identity for the test fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      - name: v1.0 condition 4 - rollback at every injection point
        run: |
          cargo test --locked -p trellis-vcs -- --nocapture             rollback_after_an_induced_panic_returns_the_repo_to_its_prior_state             rollback_restores_tracked_edits_and_removes_new_files             rollback_is_idempotent             rollback_mid_edit_between_two_writes             rollback_after_a_killed_check_subprocess             rollback_after_checks_pass_but_before_approval             rollback_still_restores_when_the_trail_write_fails             a_rollback_that_fails_is_loud_and_leaves_a_manual_path

      - name: v1.0 condition 4 - a dead orchestrator writes nothing and stops
        run: |
          cargo test --locked -p trellis-loop -- --nocapture             a_dead_orchestrator_stops_the_run_instead_of_spending_the_budget

      - name: v1.0 condition 4 - what an interrupt does, without the signal
        run: cargo test --locked -p trellis-cli -- --nocapture interrupt_tests

      # The one injection point no unit test reaches: a real SIGINT delivered
      # to a real process mid-run. Linux only - MSYS `kill -INT` raises no
      # console Ctrl-C event for a native binary, so on Windows this would
      # pass by never testing anything.
      - name: v1.0 condition 4 - SIGINT mid-run, for real
        run: |
          cargo build --locked --release -p trellis-cli
          bash docs/bench/interrupt_test.sh "$PWD/target/release/trellis"

  # The owner's deterministic guard suite (qa/run-guards.py, 11 cases), on a
  # machine that is not the owner's. The fixture is the trellis-demo history
  # vendored as qa/fixtures/trellis-demo.bundle; the runner clones it into a
  # temporary directory. No model is involved: every guard either uses a
  # scripted model or is refused before one is called.
  guards:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      # The fixture's `.trellis/config.toml` runs `python -m mypy` and
      # `python -m pytest`. Pinned to the versions the suite last held 11/11
      # with on the owner's machine, so a tool release cannot move a guard,
      # and by hash, with every transitive dependency, so a replaced file on
      # the index cannot either (qa/requirements-ci.in says how to regenerate).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Fixture checks (mypy, pytest; pinned)
        run: python -m pip install --require-hashes -r qa/requirements-ci.txt

      # The workflow audit G5 and the pre-commit hook run, with G5's flags, so
      # a workflow change that skipped both (--no-verify, a clone without the
      # hook) still meets it (#534). zizmor at the version those ran clean
      # with, by hash (.github/requirements-zizmor.txt says how to
      # regenerate), never an unpinned latest. No token is passed, as none is
      # locally, so it runs the same audits G5 does. Before the build, so a
      # finding fails in seconds.
      - name: Workflows pass zizmor at medium and above (G5; pinned)
        run: |
          python -m pip install --require-hashes -r .github/requirements-zizmor.txt
          zizmor --min-severity medium .github/workflows/

      - name: No machine-specific paths under qa/, bundle verifies
        run: bash scripts/checks/qa-portable.sh

      # history/TRELLIS-direction.md keeps a skill at 500 lines or fewer; this
      # holds the repository's own committed SKILL.md files to it (ADR 0019).
      # The self-test runs first so a check that cannot fail cannot pass.
      - name: No committed SKILL.md over 500 lines
        run: |
          bash scripts/checks/skill-lines.sh --self-test
          bash scripts/checks/skill-lines.sh

      # The source checks G3 and G5 run locally that need no build and no
      # base ref, with the flags the gates pass, so a commit that skipped the
      # hooks and the gates (--no-verify) is still held to them here (#532: a
      # basic-auth URL literal sat in install.rs for a batch because only G5
      # looked for one). Before the build, so a hit fails in seconds. Each
      # self-test runs first, so a check that cannot fail does not pass.
      # no-auth-urls.sh scans the whole tracked tree; G5 applies its pattern
      # to the change's added lines, which this covers.
      - name: No basic-auth URL literal in tracked source (G5)
        run: |
          scripts/checks/no-auth-urls.sh --self-test
          scripts/checks/no-auth-urls.sh

      - name: trellis-cli tests spawn git only through trellis_vcs (G5)
        run: |
          scripts/checks/no-bare-git-in-cli-tests.sh --self-test
          scripts/checks/no-bare-git-in-cli-tests.sh

      # The base-relative half of adr-numbers.sh runs in supply-chain, which
      # has the history it needs.
      - name: ADR numbers unique and held; exit-gate check self-test (G3)
        run: |
          bash scripts/checks/adr-numbers.sh --self-test
          bash scripts/checks/gate-checked.sh --self-test
          bash scripts/checks/adr-numbers.sh

      # Each plants its cases in a throwaway repository. Without gitleaks or
      # actionlint on the runner the pre-commit hook skips those with a note
      # (zizmor is installed above); a refusal counts only with the hook's
      # own message.
      - name: pre-push and pre-commit hook self-tests (G5)
        run: |
          bash scripts/checks/pre-push-selftest.sh
          bash scripts/checks/pre-commit-selftest.sh

      - name: Build trellis-cli
        run: cargo build --locked -p trellis-cli

      # `dirty_worktree` must be refused for its dirty tree, not for an
      # unreachable runtime, and reachability is only a TCP connect
      # (RuntimeClient::reachable). A plain listener on the fixture's runtime
      # port is enough. It is not Ollama, which is why this runs the suite
      # directly rather than through scripts/gates/guards.sh, whose
      # `/api/tags` probe it would fail. Started in this step so it is alive
      # for the whole run; it serves an empty directory.
      - name: Guard suite (every guard must hold)
        run: |
          python3 -m http.server 11434 --bind 127.0.0.1 --directory "$(mktemp -d)" >/dev/null 2>&1 &
          python3 - <<'EOF'
          import socket, sys, time
          for _ in range(50):
              try:
                  socket.create_connection(("127.0.0.1", 11434), timeout=1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          sys.exit("no listener on 127.0.0.1:11434 after 10s")
          EOF
          export PATH="$PWD/target/debug:$PATH"
          python3 qa/run-guards.py

  # Supply chain: licences, bans, sources and advisories against `deny.toml`,
  # then the RustSec database again through cargo-audit. Its own job so a new
  # advisory reads as a supply-chain failure, not as a broken build.
  supply-chain:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      # Full history: gitleaks scans every commit between the base and HEAD,
      # and a depth-1 clone has neither the base nor the commits in between.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
      # Caches ~/.cargo/bin, so the pinned tools are not recompiled per run.
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      # Pinned so a new tool release cannot change what passes: these are the
      # versions the checks were last run with locally. RUSTFLAGS is cleared
      # for this step only: the workflow-wide `-D warnings` is for trellis's
      # code, and applying it to the tools' dependency tree would fail the
      # install on a lint in code this repository does not own.
      - name: Install cargo-deny and cargo-audit (pinned)
        env:
          RUSTFLAGS: ""
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2

      # Fails on any advisory not listed, with its reason, in `deny.toml`.
      # --locked: without it cargo deny rewrites a stale lock and passes on
      # the rewritten one (#197).
      - name: Licences, bans, sources, advisories
        run: cargo deny --locked check

      # cargo-audit does not read `deny.toml`. It exits non-zero on a
      # vulnerability and reports unmaintained crates as warnings, which is
      # how RUSTSEC-2023-0089 (accepted in `deny.toml`) passes here without a
      # second ignore list.
      - name: RustSec advisories
        run: cargo audit

      # fuzz/ is its own workspace with its own lock (#95), which is not
      # updated when a crate the fuzz target reaches gains a dependency
      # (#172). The same check G5 runs: fails, naming the file, when a build
      # of fuzz/ would rewrite it, and shows on a copy that a stale lock fails.
      - name: fuzz/Cargo.lock is current
        run: scripts/checks/fuzz-lock-current.sh

      # The same check G5 runs: every cargo build/test/clippy/run in these
      # workflows passes --locked, so the steps above and in every other job
      # build what Cargo.lock records (#215). Self-test first, so a scan that
      # cannot fail does not pass.
      - name: Workflow cargo commands pass --locked
        run: |
          scripts/checks/workflows-locked.sh --self-test
          scripts/checks/workflows-locked.sh

      # The scan G5 runs (#236): gitleaks over every commit this change adds,
      # which the pre-commit hook reaches only on commits made through it.
      # The release is pinned by version and by the SHA-256 recorded in its
      # published gitleaks_8.21.2_checksums.txt, checked before the binary
      # runs; a different file fails here. It is unpacked under RUNNER_TEMP
      # and put first on PATH for this step only: the runners are
      # self-hosted, so nothing is left in the host's own directories and a
      # gitleaks the host already has does not stand in for the pinned one.
      # The self-test plants a token built at run time on a branch of a
      # throwaway repository and shows the scan refuses it. The base is the
      # PR's target branch, or for a push the commit the branch was at
      # before; an unresolvable base (an all-zero or unfetched `before`)
      # fails the step rather than scanning nothing.
      - name: gitleaks over the change's commits (pinned, checksum-verified)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          tgz="$dir/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -sSfL -o "$tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$dir" gitleaks
          export PATH="$dir:$PATH"
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          scripts/checks/gitleaks-range.sh --self-test
          scripts/checks/gitleaks-range.sh "$base"

      # The source checks G3 and G5 run against the gates' base (#532), with
      # the base the gitleaks step uses: no CI job dropped, and no ADR this
      # change adds takes a number the base already holds. GATE_BASE is set
      # because ci-jobs-unchanged.sh sources scripts/gates/lib.sh, which
      # otherwise picks origin/main for a detached HEAD.
      - name: No CI job dropped; ADR numbers against the base (G3, G5)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          GATE_BASE="$base" bash scripts/checks/ci-jobs-unchanged.sh "$base"
          bash scripts/checks/adr-numbers.sh "$base"

      # Its dependency set differs from the root's (libfuzzer-sys and what it
      # pulls in), so both audits run over it too. deny.toml at the root
      # applies: cargo deny looks upward from the manifest for its policy.
      - name: Licences, bans, sources, advisories (fuzz/)
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml check

      - name: RustSec advisories (fuzz/)
        run: cargo audit --file fuzz/Cargo.lock

      # desktop/ is a third workspace with its own lock (ADR 0048), so the
      # root's audits never read what it depends on (#384). The same guard
      # G5 runs, self-test first (#290): Tauri out of the root lock, the
      # desktop's lock current and its deny.toml in step with the root's, no
      # audit.toml, and its code inside ADR 0048's lines.
      - name: Desktop guards (ADR 0048)
        run: |
          scripts/checks/desktop-guards.sh --self-test
          scripts/checks/desktop-guards.sh

      # Unlike fuzz/, the desktop has its own policy, desktop/deny.toml (ADR
      # 0048 section 7): cargo deny reads the one nearest the manifest.
      - name: Licences, bans, sources, advisories (desktop/)
        run: cargo deny --locked --manifest-path desktop/Cargo.toml check

      - name: RustSec advisories (desktop/)
        run: cargo audit --file desktop/Cargo.lock

      # tui/ (ADR 0052 section 5, #505): go.sum matches the modules fetched,
      # govulncheck finds no known vulnerability (none is ever ignored;
      # tui/VULN-EXCEPTIONS.md lists none), and every module's licence is on
      # deny.toml's allow-list, read by the function G5 uses. Each tool at an
      # exact version, installed under RUNNER_TEMP so nothing lands in the
      # runner's own directories. The go guards first, self-test before them.
      - name: Go guards (ADR 0052)
        run: |
          scripts/checks/go-guards.sh --self-test
          scripts/checks/go-guards.sh

      - name: Go supply chain (tui/)
        env:
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/gobin"
          export PATH="$GOBIN:$PATH"
          go install -mod=readonly golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install -mod=readonly github.com/google/go-licenses/v2@v2.0.1
          GATE_BASE=HEAD
          source scripts/gates/lib.sh
          allowed=$(deny_allowed_licenses)
          cd tui
          go mod verify
          govulncheck ./...
          go-licenses check ./... --ignore github.com/maydaythecoder/trellis/tui --allowed_licenses="$allowed"

  # The graph's two structural guarantees, likewise named so a regression is
  # legible without reading the log.
  index-invariants:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      - name: Bidirectionality of forward/reverse adjacency
        run: cargo test --locked -p trellis-index --test bidirectional

      - name: Resolver rules, soundness cases first
        run: cargo test --locked -p trellis-index --test resolve_rules

      - name: Partition disjointness invariant (S19)
        run: cargo test --locked -p trellis-loop --test partition_invariants

      # tree-sitter and its grammar share a C ABI and fail at runtime, not at
      # compile time, when mismatched. This turns that into a test failure.
      - name: Grammar/library ABI pairing
        run: cargo test --locked -p trellis-index --test grammar_abi

  # v1.0 gate conditions 1 and 2, against the benchmark corpus itself.
  #
  # `04-v1.0-harness.md` names the failure this exists to prevent: recall
  # drifts down because months of resolver changes optimise for the cases
  # being looked at, and the benchmark was only ever run once, at the start.
  #
  # The corpus is fetched by the SHA-256 recorded in `01-v0.1-measure.md`, so
  # a different sdist fails here rather than quietly moving every figure in
  # the documents.
  precision-gate:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
      # GitHub-hosted only: on a self-hosted runner its cache is remote and its
      # post-job cleanup of $CARGO_HOME/bin deleted the owner's toolchain (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      - name: Fetch the benchmark corpus at its recorded hash
        run: |
          mkdir -p .bench
          curl -sSL -o .bench/poetry-2.5.0.tar.gz             https://files.pythonhosted.org/packages/source/p/poetry/poetry-2.5.0.tar.gz
          echo "e73b873890526c03e4d8e20d934292175f55a5823b3bdee2f154f63dae81336f  .bench/poetry-2.5.0.tar.gz"             | sha256sum -c -
          tar -xzf .bench/poetry-2.5.0.tar.gz -C .bench

      # Condition 2, first half: no Resolved edge names a symbol the source
      # did not call. Exits non-zero on any violation.
      - name: v1.0 condition 2 — every Resolved edge names what was called
        run: |
          cargo run --locked --release -p trellis-index --example check_soundness             -- .bench/poetry-2.5.0

      # Condition 2, second half: every cross-file Resolved edge has an import
      # path, or a verified inheritance chain, actually connecting it. This is
      # the check that reaches "the wrong `foo` in another module", which the
      # name check explicitly cannot.
      - name: v1.0 condition 2 — every cross-file edge is reachable
        run: |
          cargo run --locked --release -p trellis-index --example check_reachability             -- .bench/poetry-2.5.0

      # Condition 1. The resolver's verdicts are REGENERATED here and scored
      # against the committed human judgements. Scoring the stored pair would
      # replay history and pass forever — which is exactly how the committed
      # seed-20260919 verdicts went stale at 47.8% while every document said
      # 67.9%. The seed reproduces the sites; only the verdicts are recomputed.
      - name: v1.0 condition 1 — recall has not regressed
        run: |
          set -e
          for seed in "20260919 400 67.9" "20260920 300 72.0"; do
            set -- $seed
            dir="docs/bench/poetry-2.5.0-seed$1"
            out=".bench/regen-$1"
            cargo run --locked --release -p trellis-index --example audit_sample               -- .bench/poetry-2.5.0 "$2" "$1" "$out"
            # The human judgements are the truth and are never regenerated.
            cp "$dir/sample.json" "$out/sample.json"
            cargo run --locked --release -p trellis-index --example audit_score               -- "$out" --min-recall "$3" --min-precision 100.0
          done

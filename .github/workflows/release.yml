name: Release

# Builds the shipped binary for every supported platform.
#
# Separate from `ci.yml` on purpose. CI answers "does this change work"; this
# answers "does this produce something a stranger can run", and the two fail
# for different reasons — a release that breaks because of a linker on a
# platform nobody develops on should not be indistinguishable from a test
# regression.
#
# A tag builds artefacts. `workflow_dispatch` builds them without one, so the
# packaging can be exercised before it is needed rather than discovered
# broken at the moment someone wants a release. Both build Linux and Windows
# only, on the self-hosted runners (owner decision 2026-10-06, ADR 0052
# decision 2.5): GitHub-hosted runners have not started since 2026-09-28,
# and macOS is dropped until a macOS runner exists.
#
# Each leg ships two binaries: `trellis` and the Go TUI, `trellis-tui`
# (ADR 0052), built from `tui/` with the runner's pinned Go
# (scripts/runners/install-go.sh) and held to the same version check.
#
# A `v*` tag also publishes: the `publish` job turns the tag's artefacts into
# a GitHub release, and only for a commit already on `main` (#386). It is the
# one job here that can write to the repository; the procedure that leads to
# the tag is in docs/BUILD_SYSTEM.md, "Branches".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    # Self-hosted when the repository variables name runners (JSON label
    # lists), GitHub-hosted when unset, as ci.yml reads them (#157).
    runs-on: ${{ fromJSON(matrix.os == 'windows' && (vars.WINDOWS_RUNNER || '"windows-latest"') || (vars.LINUX_RUNNER || '"ubuntu-latest"')) }}
    # A fat-LTO release build with one codegen unit, plus the release test
    # suite on Linux; without a ceiling a stuck runner waits GitHub's default
    # 360 minutes (#381).
    timeout-minutes: 60
    # go.sum is the pin, and go.mod's toolchain line never downloads another
    # toolchain (ADR 0052 decision 2.4).
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    strategy:
      # Every platform is built even when one fails. A matrix that stops at
      # the first failure reports one broken target and hides the others,
      # which turns a release into several rounds of finding out.
      fail-fast: false
      # One Linux and one Windows leg on every trigger. The macOS leg
      # (aarch64-apple-darwin, `workflow_dispatch` only) was dropped by the
      # owner's decision of 2026-10-06 (ADR 0052 decision 2.5): releases are
      # built on the self-hosted runners, and there is no macOS one. It
      # returns when a macOS runner exists.
      matrix:
        include:
          - os: linux
            target: x86_64-unknown-linux-gnu
            bin: trellis
            tui: trellis-tui
          - os: windows
            target: x86_64-pc-windows-msvc
            bin: trellis.exe
            tui: trellis-tui.exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.target }}
      # lookup-only: a tag build must not restore a cache that a pull_request
      # run of ci.yml could have written (zizmor cache-poisoning, #215). With
      # it the action only checks for an entry and restores nothing, so the
      # release is built from an empty target directory; this step no longer
      # saves time. GitHub-hosted only, as in ci.yml (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.target }}
          lookup-only: true

      - name: Pin line endings
        run: git config --global core.autocrlf false

      # The suite runs on the release profile too. `lto = "fat"` and
      # `codegen-units = 1` change what the optimiser may do, and a test suite
      # that only ever sees the dev profile cannot notice. Linux leg only:
      # ci.yml already runs the suite on Windows for every commit, and the
      # release profile's codegen is what this step is for, which one leg
      # exercises at a tenth of macOS's price (#381).
      - name: Test, on the profile that ships
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p trellis-cli --target ${{ matrix.target }}

      # A binary that cannot answer `--version` is not a release candidate,
      # and on a cross-built target this is the first moment anything has
      # actually executed it.
      - name: It runs
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      # The Go TUI (ADR 0052). The runner's own pinned Go, checked first, as
      # ci.yml's go job does; then the Go checks (the rpc tests spawn the
      # debug trellis, so it is built for them).
      - name: Go is the pinned toolchain (scripts/runners/install-go.sh)
        shell: bash
        run: |
          v=$(go version)
          echo "$v"
          case "$v" in
            "go version go1.27.2 "*) ;;
            *) echo "::error::expected go1.27.2, the pin in scripts/runners/install-go.sh; run it on this runner"; exit 1 ;;
          esac

      - name: Go checks (tui/)
        shell: bash
        run: |
          cargo build --locked -p trellis-cli
          scripts/checks/go-test.sh

      # CGO_ENABLED=0 and -trimpath (ADR 0052 section 5): a static binary
      # with no build machine's paths in it; -buildvcs=false, since the
      # version is the tag's and nothing else. The version is the tag's
      # without its `v`, or `dev` from `workflow_dispatch`; the ref reaches
      # the shell through env, never through an expression in `run:`.
      - name: Build trellis-tui
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          OUT: ../target/${{ matrix.target }}/release/${{ matrix.tui }}
        run: |
          set -euo pipefail
          version=dev
          if [ "$EVENT" = push ] && printf '%s\n' "$REF_NAME" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            version="${REF_NAME#v}"
          fi
          cd tui
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -ldflags "-X main.version=$version" -o "$OUT" ./cmd/trellis-tui

      - name: trellis-tui runs
        run: ./target/${{ matrix.target }}/release/${{ matrix.tui }} --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="trellis-${{ matrix.target }}"
          mkdir -p "dist/$out"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$out/"
          # Beside trellis: `trellis tui` looks for it there and nowhere else.
          cp "target/${{ matrix.target }}/release/${{ matrix.tui }}" "dist/$out/"
          cp dist/QUICKSTART.md "dist/$out/"
          cp LICENSE "dist/$out/" 2>/dev/null || true
          # A checksum beside the binaries, because "download this and run
          # it" deserves a way to check what arrived is what was built.
          (cd "dist/$out" && sha256sum "${{ matrix.bin }}" "${{ matrix.tui }}" > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trellis-${{ matrix.target }}
          path: dist/trellis-${{ matrix.target }}/
          if-no-files-found: error

  # Turns a tag's artefacts into a GitHub release, so a release outlives the
  # 90 days an uploaded artifact is kept (#386). A tag push only:
  # `workflow_dispatch` has no tag to release. It runs after every leg of
  # `build` has passed, and refuses before writing anything unless the tagged
  # commit is already on `main` (ADR 0051: `main` is what ships, and the owner
  # moves it) and both Linux binaries report the tag's version, so a tag
  # pushed on `dev`, or one that does not match Cargo.toml or the TUI's
  # build, publishes nothing. On the self-hosted Linux runner, like `build`
  # (ADR 0052 decision 2.5); it needs `gh` and `zip` there.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    # Downloads, checksums and one API call; nothing is compiled here.
    timeout-minutes: 15
    # The only job with write access, and only to contents: `gh release
    # create` needs it. The workflow default above stays read-only for
    # `build`, which runs the code under test.
    permissions:
      contents: write
    steps:
      # Full history so `origin/main` is present for the ancestry check:
      # with the token not persisted, a later `git fetch` could not
      # authenticate, and nothing here pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tag name reaches the shell through env, never through an
      # expression in `run:`, and is held to vX.Y.Z before anything uses it.
      - name: The tag is vX.Y.Z and its commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::refusing to publish: tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::refusing to publish: $TAG ($(git rev-parse HEAD)) is not on main"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: trellis-*
          path: artifacts

      # The binaries that ship answer for the version, not the manifest: the
      # same --version `build` ran, compared with the tag this time, for
      # trellis and for trellis-tui. Both are checked before either answer
      # is acted on, and nothing is written unless both match. The artifact
      # upload drops the execute bit, so it is put back first.
      - name: trellis --version and trellis-tui --version equal the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir=artifacts/trellis-x86_64-unknown-linux-gnu
          bad=0
          for name in trellis trellis-tui; do
            chmod +x "$dir/$name"
            got=$("$dir/$name" --version)
            want="$name ${TAG#v}"
            if [ "$got" != "$want" ]; then
              echo "::error::refusing to publish: $name says '$got', the tag wants '$want'"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

      # One archive per target, and one SHA256SUMS over the archives, so a
      # download can be checked before it is unpacked (each archive keeps the
      # per-binary SHA256SUMS `build` wrote inside it).
      - name: Archive and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/trellis-*/; do
            name=$(basename "$dir")
            case "$name" in
              *-windows-*) (cd artifacts && zip -qr "../release/$name.zip" "$name") ;;
              *) tar -C artifacts -czf "release/$name.tar.gz" "$name" ;;
            esac
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      # --verify-tag: the release attaches to the tag that was pushed and
      # never creates one. The token goes to gh through env only.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "$TAG" \
            --notes "What $TAG contains is under its heading in CHANGELOG.md."

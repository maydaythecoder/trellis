name: Release

# Builds the shipped binary for every supported platform.
#
# Separate from `ci.yml` on purpose. CI answers "does this change work"; this
# answers "does this produce something a stranger can run", and the two fail
# for different reasons — a release that breaks because of a linker on a
# platform nobody develops on should not be indistinguishable from a test
# regression.
#
# A tag builds artefacts. `workflow_dispatch` builds them without one, so the
# packaging can be exercised before it is needed rather than discovered
# broken at the moment someone wants a release. A tag builds Linux and
# Windows; `workflow_dispatch` adds macOS (see the matrix, #381).
#
# A `v*` tag also publishes: the `publish` job turns the tag's artefacts into
# a GitHub release, and only for a commit already on `main` (#386). It is the
# one job here that can write to the repository; the procedure that leads to
# the tag is in docs/BUILD_SYSTEM.md, "Branches".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A fat-LTO release build with one codegen unit, plus the release test
    # suite on Linux; without a ceiling a stuck runner waits GitHub's default
    # 360 minutes (#381).
    timeout-minutes: 60
    strategy:
      # Every platform is built even when one fails. A matrix that stops at
      # the first failure reports one broken target and hides the others,
      # which turns a release into several rounds of finding out.
      fail-fast: false
      # Linux and Windows on every trigger. macOS (aarch64-apple-darwin) only
      # on `workflow_dispatch`: its minutes cost ten times Linux's on a
      # private repository (#381), and it is built here, never run by a human
      # on this project; the supported-platform list in the documentation
      # says so rather than implying parity with the two used daily. The list
      # is chosen by event because `exclude` and `include` cannot drop a leg
      # conditionally, and a job-level `if` would skip every leg at once.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","bin":"trellis"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bin":"trellis.exe"},{"os":"macos-latest","target":"aarch64-apple-darwin","bin":"trellis"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","bin":"trellis"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bin":"trellis.exe"}]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, resolved 2026-09-30
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.target }}
      # lookup-only: a tag build must not restore a cache that a pull_request
      # run of ci.yml could have written (zizmor cache-poisoning, #215). With
      # it the action only checks for an entry and restores nothing, so the
      # release is built from an empty target directory; this step no longer
      # saves time. GitHub-hosted only, as in ci.yml (#158).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.target }}
          lookup-only: true

      - name: Pin line endings
        run: git config --global core.autocrlf false

      # The suite runs on the release profile too. `lto = "fat"` and
      # `codegen-units = 1` change what the optimiser may do, and a test suite
      # that only ever sees the dev profile cannot notice. Linux leg only:
      # ci.yml already runs the suite on Windows for every commit, and the
      # release profile's codegen is what this step is for, which one leg
      # exercises at a tenth of macOS's price (#381).
      - name: Test, on the profile that ships
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p trellis-cli --target ${{ matrix.target }}

      # A binary that cannot answer `--version` is not a release candidate,
      # and on a cross-built target this is the first moment anything has
      # actually executed it.
      - name: It runs
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="trellis-${{ matrix.target }}"
          mkdir -p "dist/$out"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$out/"
          cp dist/QUICKSTART.md "dist/$out/"
          cp LICENSE "dist/$out/" 2>/dev/null || true
          # A checksum beside the binary, because "download this and run it"
          # deserves a way to check what arrived is what was built.
          (cd "dist/$out" && sha256sum "${{ matrix.bin }}" > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trellis-${{ matrix.target }}
          path: dist/trellis-${{ matrix.target }}/
          if-no-files-found: error

  # Turns a tag's artefacts into a GitHub release, so a release outlives the
  # 90 days an uploaded artifact is kept (#386). A tag push only:
  # `workflow_dispatch` has no tag to release. It runs after every leg of
  # `build` has passed, and refuses before writing anything unless the tagged
  # commit is already on `main` (ADR 0051: `main` is what ships, and the owner
  # moves it) and the Linux binary reports the tag's version, so a tag pushed
  # on `dev`, or one that does not match Cargo.toml, publishes nothing.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Downloads, checksums and one API call; nothing is compiled here.
    timeout-minutes: 15
    # The only job with write access, and only to contents: `gh release
    # create` needs it. The workflow default above stays read-only for
    # `build`, which runs the code under test.
    permissions:
      contents: write
    steps:
      # Full history so `origin/main` is present for the ancestry check:
      # with the token not persisted, a later `git fetch` could not
      # authenticate, and nothing here pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tag name reaches the shell through env, never through an
      # expression in `run:`, and is held to vX.Y.Z before anything uses it.
      - name: The tag is vX.Y.Z and its commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::refusing to publish: tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::refusing to publish: $TAG ($(git rev-parse HEAD)) is not on main"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: trellis-*
          path: artifacts

      # The binary that ships answers for the version, not the manifest: the
      # same --version `build` ran, compared with the tag this time. The
      # artifact upload drops the execute bit, so it is put back first.
      - name: trellis --version equals the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bin=artifacts/trellis-x86_64-unknown-linux-gnu/trellis
          chmod +x "$bin"
          got=$("$bin" --version)
          want="trellis ${TAG#v}"
          if [ "$got" != "$want" ]; then
            echo "::error::refusing to publish: the binary says '$got', the tag wants '$want'"
            exit 1
          fi

      # One archive per target, and one SHA256SUMS over the archives, so a
      # download can be checked before it is unpacked (each archive keeps the
      # per-binary SHA256SUMS `build` wrote inside it).
      - name: Archive and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/trellis-*/; do
            name=$(basename "$dir")
            case "$name" in
              *-windows-*) (cd artifacts && zip -qr "../release/$name.zip" "$name") ;;
              *) tar -C artifacts -czf "release/$name.tar.gz" "$name" ;;
            esac
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      # --verify-tag: the release attaches to the tag that was pushed and
      # never creates one. The token goes to gh through env only.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "$TAG" \
            --notes "What $TAG contains is under its heading in CHANGELOG.md."

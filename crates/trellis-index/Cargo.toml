[package]
name = "trellis-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal to this workspace: the deliverable is the `trellis` binary, not
# a set of library crates. Saying so prevents an accidental `cargo publish` and
# lets `cargo deny` treat the intra-workspace path dependencies as what they
# are rather than as unversioned registry wildcards.
publish = false

# NOTE: trellis-index must never depend on trellis-model. The call graph has
# to be testable with no model anywhere near it, and a graph whose output
# depends on a sampler is not a graph. Enforced by review and by this
# comment; see docs/adr/0001-resolver-scope-and-build-not-consume.md.
[dependencies]
trellis-core.workspace = true
tree-sitter.workspace = true
tree-sitter-python.workspace = true
serde.workspace = true
smallvec.workspace = true
rayon.workspace = true
walkdir.workspace = true
postcard.workspace = true
tracing.workspace = true
# The Pyright backstop's LSP messages (ADR 0031). Already a workspace runtime
# dependency of other crates; no crate added to Cargo.lock.
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true

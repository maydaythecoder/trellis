[package]
name = "trellis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal to this workspace: the deliverable is the `trellis` binary, not
# the library crates beside it. Saying so prevents an accidental `cargo publish` and
# lets `cargo deny` treat the intra-workspace path dependencies as what they
# are rather than as unversioned registry wildcards.
publish = false

[[bin]]
name = "trellis"
path = "src/main.rs"

[dependencies]
trellis-core.workspace = true
trellis-index.workspace = true
trellis-checks.workspace = true
trellis-model.workspace = true
trellis-loop.workspace = true
trellis-trail.workspace = true
trellis-vcs.workspace = true
trellis-vault.workspace = true
trellis-queue.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
# The outcome JSON an after_run hook reads (ADR 0023), and `--json`,
# `log --json` and `rpc` framing (ADR 0025); already in the tree.
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
# `json`: the `--log-json` formatter (ADR 0020 §7). Adds `tracing-serde`;
# serde and serde_json were already in the tree.
tracing-subscriber = { workspace = true, features = ["json"] }
rustyline.workspace = true
# `trellis vault` (ADR 0022): dates.json records *local* calendar days, as
# Apex's JavaScript `Date` computes them, and std has no time zones. The vault
# crate takes days as strings so it stays free of it. Only the features the
# two calls in `vault_cmd.rs` need (#154):
#   std                  `Zoned::now` and `Timestamp: TryFrom<SystemTime>`.
#   tz-system            `TimeZone::system()`: the machine's zone is what
#                        makes the day local.
#   tzdb-bundle-platform Windows has no system zoneinfo, so the zone's rules
#                        come from data compiled in.
#   tzdb-zoneinfo        Unix: the rules come from /usr/share/zoneinfo.
# Dropped defaults: `perf-inline`, `tz-fat`, `tzdb-concatenated` (Android's
# tzdb format). Features unify across the workspace, and this set contains
# trellis-queue's (`std`, `tzdb-bundle-platform`, `tzdb-zoneinfo`), so its
# zone lookup is unaffected.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
tui-demo = { path = "../tui-demo", default-features = false }

# Windows Job Objects for what this crate spawns (ADR 0035).
[target.'cfg(windows)'.dependencies]
process-wrap.workspace = true

# HTTPS to hosted providers (ADR 0024). On by default: the release binary
# is built with default features, so this is what ships. `--no-default-features`
# builds the local-only binary, which refuses an https endpoint with a message
# naming this feature. Measured cost in ADR 0024, "Measurements".
[features]
default = ["hosted"]
hosted = ["trellis-model/hosted"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

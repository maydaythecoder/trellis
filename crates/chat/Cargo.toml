[package]
name = "chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Standalone by design: this crate depends on nothing else in the workspace.
# The interface runs against a mock stream, so it can be driven, resized,
# panicked and exited with no model, no runtime and no repository.
publish = false

[dependencies]
# Depend on `ratatui` only, never the 0.30 sub-crates (`ratatui-core`,
# `ratatui-widgets`) — mixing the facade with a sub-crate is how you get two
# incompatible `Style` types in one build.
#
# `crossterm` is listed directly only to turn on `event-stream`. Its version
# must match the one ratatui uses, and in code we always reach it through
# `ratatui::crossterm::...` so the types are guaranteed identical.
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Versions resolved against ratatui 0.30 rather than taken from the brief:
# the numbers there (tui-logger 0.14, ansi-to-tui 7, tui-scrollview 0.5) are
# the 0.29-era releases. `cargo tree -d` is the check that matters — two
# ratatui versions in one build is the failure this pinning avoids.
tui-logger = { version = "0.18", default-features = false, features = ["crossterm", "tracing-support"] }
ansi-to-tui = "8"
tui-scrollview = "0.6"

[dev-dependencies]
insta = "1"

[lints]
workspace = true

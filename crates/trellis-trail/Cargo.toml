[package]
name = "trellis-trail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal to this workspace: the deliverable is the `trellis` binary, not
# its library crates. Saying so prevents an accidental `cargo publish` and
# lets `cargo deny` treat the intra-workspace path dependencies as what they
# are rather than as unversioned registry wildcards.
publish = false

[dependencies]
trellis-checks.workspace = true
# For `links`, the one link refusal every writer under .trellis/ shares
# (#723). Already in the tree through trellis-checks: a new edge, not a new
# package.
trellis-core.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true

[lints]
workspace = true

[package]
name = "trellis-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal to this workspace: the deliverable is the `trellis` binary, not
# eight library crates. Saying so prevents an accidental `cargo publish` and
# lets `cargo deny` treat the intra-workspace path dependencies as what they
# are rather than as unversioned registry wildcards.
publish = false

[dependencies]
trellis-core.workspace = true
trellis-index.workspace = true
trellis-checks.workspace = true
trellis-model.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The trust store's fingerprint (ADR 0023); already in the tree for the trail.
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Turns on trellis-model's `grammar` feature for test builds only. The
# caller here is `wire.rs`'s test that the hand-written tool-call schema
# compiles; trellis-model has two more of its own, which its own
# dev-dependency covers.
trellis-model = { workspace = true, features = ["grammar"] }
smallvec.workspace = true
tempfile.workspace = true

[lints]
workspace = true

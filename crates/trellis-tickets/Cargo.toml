[package]
name = "trellis-tickets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Maintainer tooling for trellis's own GitHub issues (ADR 0040), not part of
# the shipped `trellis` binary.
publish = false

# ADR 0040 decision 1: a binary of its own, so the `trellis` CLI surface
# (brief 4.12) does not grow.
[[bin]]
name = "trellis-tickets"
path = "src/main.rs"

# The rule engine is pure functions over an issue's text. `trellis-core` is
# the one first-party dependency ADR 0040 allows (decision 2): it is where
# `secrets::scrub` lives, which every `gh` spawn the commands make must go
# through (decision 5). No trellis crate may depend on this one.
#
# The rest come from `[workspace.dependencies]`, as decision 2 allows:
# `serde` and `serde_json` read `gh issue view --json` and write
# `triage --json`; `thiserror` for the library's intake errors; `clap` and
# `anyhow` for the binary only.
[dependencies]
trellis-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true
anyhow.workspace = true

[lints]
workspace = true

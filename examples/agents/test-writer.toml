# A starter profile (ADR 0026 §4). Copy this directory's contents into
# .trellis/agents/ to use it: the `instructions` path below is resolved
# under .trellis/, so it names .trellis/agents/instructions/test-writer.md.
#
# No `tools` list: the run uses whatever tools the repository enabled and
# trusted. No `reports_to`: this profile does not hand its work to another
# agent for judgment, because no agent issues a verdict on another agent's
# output (ADR 0005). trellis's own checks decide whether a change passes.
role = "test-writer"
instructions = "agents/instructions/test-writer.md"

# The only paths this profile's runs may write (#182), in deny_write's
# rule syntax: `tests/` anything under the top-level tests directory,
# `*_test.py` any file ending so, `conftest.py` the repository-root one.
# The instructions say "tests only" too, but this list is what enforces it:
# a write outside it is refused before it happens.
#
# Not covered, because the syntax cannot say it: `test_*.py` beside the
# source (an infix `*` is not a wildcard there; the entry would be an exact
# path that matches nothing) and a `tests/` directory nested inside a
# package (`pkg/tests/`). Add the directories your repository uses, e.g.
# "src/pkg/tests/", after copying.
allow_write = ["tests/", "*_test.py", "conftest.py"]

[control]
# Every edit is shown to you before it is written. `work` can claim this
# profile's tasks only when it runs attached to a terminal (ADR 0026 §4).
mode = "approve"

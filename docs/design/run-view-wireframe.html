<style>/* TRELLIS — component styles. Every colour, length and radius is a token from tokens.css. */
.cd-stage { padding: var(--space-6); background: var(--ground); font-family: var(--font-sans); color: var(--ink);
  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: var(--space-6) var(--space-6); background-position: calc(var(--space-6) / 2) calc(var(--space-6) / 2); }
.cd-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }

.cd-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Panel */

.cd-corner-tl { top: -3px; left: -3px; border-top-width: 1px; border-left-width: 1px; }

.cd-stat-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); font: 400 12px/16px var(--font-mono); color: var(--ink-muted); font-variant-numeric: tabular-nums; }

.cd-delta-up { color: var(--up); }

/* Sparkline */

.cd-spark-up .cd-spark-line { stroke: var(--up); } .cd-spark-up .cd-spark-area, .cd-spark-up .cd-spark-dot { fill: var(--up); }

/* Button */

/* Status */
.cd-status { display: inline-flex; align-items: center; gap: var(--space-1\.5); font: 500 12px/16px var(--font-mono); letter-spacing: 0.02em; white-space: nowrap; }
.cd-status-dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; flex: none; }
.cd-status-ok { color: var(--ok); }
.cd-status-down { color: var(--down); }
.cd-status-warn { color: var(--warn); }
.cd-status-signal { color: var(--signal); }
.cd-status-cool { color: var(--cool); }
.cd-status-idle { color: var(--ink-muted); }
.cd-status-tag { padding: var(--space-0\.5) var(--space-1\.5); border-radius: var(--radius-xs); }
.cd-status-tag.cd-status-ok { background: var(--ok-soft); } .cd-status-tag.cd-status-down { background: var(--down-soft); }
.cd-status-tag.cd-status-signal, .cd-status-tag.cd-status-warn { background: var(--signal-soft); } .cd-status-tag.cd-status-cool { background: var(--cool-soft); }
.cd-status-tag.cd-status-idle { background: var(--panel-raised); }
.cd-status-live .cd-status-dot { box-shadow: 0 0 0 2px var(--signal-soft); }

/* Panel — drill affordance */
.cd-drill { display: inline-flex; align-items: center; gap: var(--space-1); background: transparent; border: 0; padding: 0 var(--space-1); border-radius: var(--radius-xs); font: 500 12px/16px var(--font-mono); color: var(--ink-muted); cursor: pointer; }
.cd-drill:hover { color: var(--signal); }
.cd-drill:focus-visible { outline: 1px solid var(--signal-ring); outline-offset: 1px; }
.cd-panel-level { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); letter-spacing: 0.04em; }

/* Trail */
.cd-trail { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); font: 400 12px/16px var(--font-mono); color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.cd-trail-path { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

.cd-trail-seg:hover { color: var(--ink); }
.cd-trail-seg:focus-visible { outline: 1px solid var(--signal-ring); outline-offset: 2px; }
.cd-trail-current { color: var(--ink); font-weight: 500; box-shadow: inset 0 -1px 0 var(--signal); padding-bottom: 1px; }
.cd-trail-sep { color: var(--ink-muted); }

.cd-trail-ticks { display: inline-flex; gap: 3px; }

/* Node + Edges (canvas) */
.cd-canvas { position: relative; background: var(--panel-inset); box-shadow: var(--frame); overflow: hidden;
  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: var(--space-6) var(--space-6); }
.cd-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.cd-edge-cool { stroke: var(--edge-cool); }
.cd-edge-dashed { stroke-dasharray: 3 3; }
.cd-edge-label { font: 400 11px/14px var(--font-mono); fill: var(--ink-muted); }
.cd-edge-label-bg { fill: var(--panel-inset); }
.cd-port { fill: var(--edge); }
.cd-port-active { fill: var(--edge-active); }
.cd-port-cool { fill: var(--edge-cool); }
.cd-node { position: absolute; display: flex; flex-direction: column; gap: 2px; min-width: 96px; padding: var(--space-2) var(--space-3); background: var(--panel); box-shadow: var(--frame-strong); border-radius: var(--radius-node); font-family: var(--font-mono); color: var(--ink); cursor: default; }
.cd-node:hover { background: var(--panel-raised); }

.cd-node-title { font: 500 12px/16px var(--font-mono); color: var(--ink); display: flex; align-items: center; gap: var(--space-1\.5); }
.cd-node-glyph { color: var(--ink-muted); }
.cd-node-selected .cd-node-glyph { color: var(--signal); }
.cd-node-play .cd-node-glyph { color: var(--play); }
.cd-node-sub { font: 400 11px/14px var(--font-mono); color: var(--ink-muted); }
.cd-node-dot { position: absolute; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--edge); top: 50%; margin-top: -3px; }
.cd-node-dot-in { left: -3px; } .cd-node-dot-out { right: -3px; }
.cd-node-selected .cd-node-dot { background: var(--edge-active); }

/* Meter (ASCII bar) */
.cd-meter { display: inline-flex; align-items: baseline; gap: var(--space-2); font: 400 13px/20px var(--font-mono); font-variant-numeric: tabular-nums; white-space: pre; color: var(--ink-secondary); }
.cd-meter-label { font: 600 11px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-secondary); min-width: 72px; }
.cd-meter-bar { letter-spacing: -0.02em; }
.cd-meter-on { color: var(--signal); } .cd-meter-off { color: var(--line-strong); }
.cd-meter-cool .cd-meter-on { color: var(--cool); } .cd-meter-play .cd-meter-on { color: var(--play); } .cd-meter-down .cd-meter-on { color: var(--down); } .cd-meter-ok .cd-meter-on { color: var(--ok); }
.cd-meter-value { color: var(--ink); min-width: 4ch; text-align: right; }

.cd-ascii-play { color: var(--play); }
.cd-ascii-signal { color: var(--signal); }

.cd-agent-name { font: 500 13px/20px var(--font-mono); color: var(--ink); display: flex; align-items: center; gap: var(--space-1\.5); }
.cd-agent-glyph { color: var(--ink-muted); }
.cd-agent-model { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); }
.cd-agent-tool { font: 400 12px/16px var(--font-mono); color: var(--ink-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cd-agent-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }

/* Diff */

.cd-diff-file { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-1\.5) var(--space-3); border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.cd-diff-counts { font-weight: 400; } .cd-diff-counts .a { color: var(--diff-add); } .cd-diff-counts .d { color: var(--diff-del); margin-left: var(--space-2); }

.cd-rail-row { position: relative; display: grid; grid-template-columns: 1fr auto; gap: var(--space-3); padding: var(--space-1) 0 var(--space-1) var(--space-3); color: var(--ink-secondary); font-size: 13px; line-height: 20px; }
.cd-rail-row::before { content: ''; position: absolute; left: calc(-1 * var(--space-4) + 1px); top: 11px; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line-strong); box-shadow: 0 0 0 2px var(--panel); }
.cd-rail-ok::before { background: var(--ok); } .cd-rail-down::before { background: var(--down); } .cd-rail-signal::before { background: var(--signal); } .cd-rail-cool::before { background: var(--cool); } .cd-rail-play::before { background: var(--play); }

.cd-rail-current::before { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--signal); }
.cd-rail-meta { font-size: 12px; line-height: 20px; color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cd-rail-row[tabindex]:hover { color: var(--ink); cursor: pointer; }

/* Shell */

  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: var(--space-6) var(--space-6); }
.cd-shell-top { padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line); background: var(--ground); }

.cd-shell-rail span.on { color: var(--signal); }
.cd-shell-body { padding: var(--space-4); display: grid; gap: var(--space-6); align-content: start; }
.cd-shell-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-1\.5) var(--space-4); border-top: 1px solid var(--line); background: var(--ground); font: 400 12px/16px var(--font-mono); color: var(--ink-muted); }
.cd-shell-bar .cd-row { gap: var(--space-4); flex-wrap: nowrap; white-space: nowrap; }
.cd-stat-sm { min-width: 0; }

.cd-q-state { font-size: 11px; color: var(--ink-muted); display: block; }
.cd-q-state.delivered { color: var(--ok); }
.cd-q-state.undelivered { color: var(--down); }
.cd-q-list { counter-reset: q; list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1\.5); }
.cd-q-ctl { display: inline-flex; gap: 2px; }
.cd-q-ctl button { background: transparent; border: 0; color: var(--ink-muted); font: inherit; cursor: pointer; padding: 0 var(--space-1); }
.cd-q-ctl button:hover { color: var(--ink); }
.cd-q-ctl button.x:hover { color: var(--down); }
.cd-q-ctl button:disabled { opacity: 0.3; cursor: default; }
.cd-q-kind-stop { color: var(--down); }
.cd-q-kind-steer { color: var(--signal); }
.cd-q-kind-follow { color: var(--cool); }
.cd-q-done { opacity: 0.6; }

/* Plan / model's last words */
.cd-said { font: 400 14px/20px var(--font-sans); color: var(--ink); padding: var(--space-2) var(--space-3); background: var(--panel-inset); box-shadow: var(--frame); border-left: 2px solid var(--line-strong); white-space: pre-wrap; }
.cd-said-head { display: flex; justify-content: space-between; align-items: center; font: 500 11px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: var(--space-1\.5); }
.cd-plan-none { font: 400 12px/18px var(--font-mono); color: var(--ink-muted); }

/* Code */
.cd-file-state { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.cd-rv-src .ln { grid-template-columns: 5ch 1fr auto; }
.cd-rv-src .ln:hover { background: var(--panel-raised); }
.cd-rv-src .ln .cmt { visibility: hidden; color: var(--ink-muted); padding: 0 var(--space-2); cursor: pointer; }
.cd-rv-src .ln:hover .cmt { visibility: visible; }
.cd-diff-line { position: relative; }
.cd-diff-line .cmt { position: absolute; right: var(--space-2); top: 0; visibility: hidden; color: var(--ink-muted); cursor: pointer; }
.cd-diff-line:hover .cmt { visibility: visible; }
.cd-line-comment { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--signal-soft); border-left: 2px solid var(--signal); font: 400 12px/18px var(--font-mono); color: var(--ink); align-items: center; }
.cd-line-comment input { background: var(--panel); color: var(--ink); border: 0; box-shadow: var(--frame-strong); font: inherit; padding: var(--space-1) var(--space-2); width: 100%; }
.cd-approve-bar { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-3); background: var(--panel-raised); border-bottom: 1px solid var(--line); font: 400 12px/18px var(--font-mono); color: var(--warn); }
.cd-approve-bar .spacer { flex: 1; }

/* Summary */
.cd-sum-outcome { display: flex; gap: var(--space-4); align-items: baseline; font-family: var(--font-mono); }
.cd-sum-word { font-size: 24px; line-height: 28px; font-weight: 500; color: var(--ink); }
.cd-sum-word.ok { color: var(--ok); } .cd-sum-word.down { color: var(--down); } .cd-sum-word.live { color: var(--signal); }
.cd-sum-exit { color: var(--ink-muted); font-size: 12px; }
.cd-sum-table { width: 100%; border-collapse: collapse; font: 400 12px/18px var(--font-mono); color: var(--ink-secondary); }
.cd-sum-table th { text-align: left; font-weight: 500; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); padding: var(--space-1) var(--space-2); border-bottom: 1px solid var(--line); }
.cd-sum-table td { padding: var(--space-1) var(--space-2); border-bottom: 1px solid var(--line); color: var(--ink); vertical-align: top; }
.cd-sum-table td.ok { color: var(--ok); } .cd-sum-table td.down { color: var(--down); } .cd-sum-table td.muted { color: var(--ink-muted); }
.cd-sum-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-sum-fence { font: 400 13px/20px var(--font-sans); color: var(--ink-secondary); padding: var(--space-2) var(--space-3); background: var(--panel-inset); box-shadow: var(--frame); border-left: 2px solid var(--line-strong); }
.cd-sum-fence-head { font: 500 10px/14px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: var(--space-1); }
.cd-sum-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
.cd-sum-live { font: 400 11px/16px var(--font-mono); color: var(--signal); }

/* TUI artboard */
.cd-tui-wrap { display: grid; gap: var(--space-3); }
.cd-tui { margin: 0; font: 400 13px/18px var(--font-mono); color: var(--ink-secondary); background: var(--panel-inset); box-shadow: var(--frame); padding: var(--space-3); white-space: pre; overflow: auto; }
.cd-tui .s { color: var(--signal); } .cd-tui .c { color: var(--cool); } .cd-tui .o { color: var(--ok); } .cd-tui .d { color: var(--down); } .cd-tui .w { color: var(--warn); } .cd-tui .i { color: var(--ink); } .cd-tui .m { color: var(--ink-muted); } .cd-tui .inv { background: var(--signal); color: var(--ink-inverse); }
.cd-tui-note { font: 400 12px/18px var(--font-mono); color: var(--ink-muted); }

/* Legend */
.cd-legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2) var(--space-6); font: 400 12px/18px var(--font-mono); color: var(--ink-secondary); }
.cd-legend b { color: var(--ink); font-weight: 500; }
.cd-legend .new { color: var(--down); }
.cd-legend .have { color: var(--play); }

.cd-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
.cd-facts h4 { margin: 0 0 var(--space-1\.5); font: 500 10px/14px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
.cd-fact { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2); align-items: baseline; font: 400 12px/22px var(--font-mono); color: var(--ink-secondary); }
.cd-fact b { font-size: 20px; line-height: 22px; font-weight: 500; color: var(--ink); min-width: 2ch; text-align: right; }
.cd-fact small { color: var(--ink-muted); font-size: 11px; }
.cd-code-hint { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); padding: var(--space-1) var(--space-3); border-top: 1px solid var(--line); }
.cd-rail-meta { white-space: normal; text-align: right; }
</style>

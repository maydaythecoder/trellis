# TRELLIS repository configuration.
#
# WARNING: this file is committed. Never put an API key here — read keys from
# the environment. See docs/ADRs/0010-byok-and-key-handling.md.

[checks]
# Commands are configured, not detected. A wrong guess produces a confident
# verdict about the wrong thing.
typecheck = ["mypy"]
tests     = ["pytest", "-q"]
python    = "python"

[budget]
# ASSUMPTION A-7: placeholders, not measurements. Calibration comes from real
# usage after v0.2 (S8). The token ceiling applies on local weights too — a
# runaway loop spends your money regardless of how cheap tokens look.
max_iterations   = 40
max_wall_clock_s = 1200
max_tokens       = 2000000
regime           = "local"   # "local" | "metered"

[agents]
# 1, or "auto" to derive from MEASURED backend batching capacity — never from
# CPU count. Multi-agent mode needs a continuous-batching runtime (vLLM,
# SGLang); on llama.cpp or Ollama, agents queue on one GPU and there is no
# speedup. `trellis doctor` reports which you have. See S18.
count = 1

# "all-or-nothing" (default, correct under partial recall) | "land-clean"
failure_policy = "all-or-nothing"

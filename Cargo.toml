[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz workspace (fuzz/Cargo.toml): nightly-only, with its own lock.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

# Versions below were resolved by `cargo add` on 2026-09-18 and their licenses
# checked (see docs/adr/0006-adapter-tiers-and-inference-path.md and
# OPEN_QUESTIONS.md). Do not bump tree-sitter and tree-sitter-python
# independently: the grammar and the library share an ABI. The pairing
# 0.27 / 0.25 is verified by crates/trellis-index/tests/grammar_abi.rs.
[workspace.dependencies]
tree-sitter        = "0.27.0"
tree-sitter-python = "0.25.0"
llguidance         = "1.8.0"
# Line editing and history for the interactive session. Default
# features off: the extras are a fuzzy finder, a sqlite history
# backend and clipboard integration, none of which a task prompt needs.
rustyline          = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
# Compile-fail tests. The v0.2 gate asks for a *compile-fail* proof that
# `Verdict` cannot be forged; asserting it by inspection is not that.
trybuild           = "1.0.113"
# The v0.3 gate asks for a tamper-evident factual section. A 64-bit
# non-cryptographic hash would not be evidence of anything.
sha2               = "0.10.9"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.151"
schemars           = "1.2.2"
tokio              = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "process", "net", "io-util", "signal"] }
rayon              = "1.12.0"
postcard           = { version = "1.1.3", features = ["use-std"] }
clap               = { version = "4.6.7", features = ["derive"] }
toml               = "1.1.6"
thiserror          = "2.0.20"
anyhow             = "1.0.104"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23" }
smallvec           = { version = "1.16.1", features = ["serde", "union"] }
walkdir            = "2.5.0"
insta              = "1.48.0"
tempfile           = "3.17.1"
# Windows only (ADR 0035): exec children and process agents spawn into a Job
# Object with kill-on-close and no breakaway, so what they start ends with
# them. `kill-on-drop` is what sets JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE; it
# adds no crate. The `unsafe` Win32 calls live in this crate, not ours.
process-wrap       = { version = "10.0.1", default-features = false, features = ["job-object", "kill-on-drop", "tokio1"] }

trellis-core   = { path = "crates/trellis-core" }
trellis-index  = { path = "crates/trellis-index" }
trellis-checks = { path = "crates/trellis-checks" }
trellis-model  = { path = "crates/trellis-model" }
trellis-loop   = { path = "crates/trellis-loop" }
trellis-trail  = { path = "crates/trellis-trail" }
trellis-vcs    = { path = "crates/trellis-vcs" }
trellis-queue  = { path = "crates/trellis-queue" }
trellis-vault  = { path = "crates/trellis-vault" }

[workspace.lints.rust]
unsafe_code = "forbid"

# cargo-fuzz builds every crate with `--cfg fuzzing`; `trellis-model` exposes
# its HTTP response parser to the fuzz target only under it (issue #97, ADR
# 0027). Declared here so the ordinary build does not warn on an unknown cfg,
# which G3's `-D warnings` would turn into a failure. The lint stays on for
# every other cfg name.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# `pub` on an item nothing outside the crate can reach is a claim about API
# that is not true. It matters most in `trellis-cli`, which is a binary: `pub`
# there reaches nobody at all, and seventeen items were written that way.
#
# The value is the lint being on rather than the seventeen edits. Quality audit
# Pass 5 is about visibility, and a pass that fixes a class by hand without
# preventing its return has done half the work.
unreachable_pub = "warn"

# The shipped binary.
#
# `panic = "abort"` is deliberately NOT set, and it is the obvious thing to
# reach for. Unwinding is load-bearing here: `Snapshot::rollback` is proven
# against an induced panic with `catch_unwind`, and the TUI restores the
# terminal from `Drop` — neither survives an abort. A smaller binary is worth
# less than a failure path that still works.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

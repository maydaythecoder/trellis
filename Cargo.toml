[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

# Versions below were resolved by `cargo add` on 2026-09-18 and their licenses
# checked (see docs/adr/0006-adapter-tiers-and-inference-path.md and
# OPEN_QUESTIONS.md). Do not bump tree-sitter and tree-sitter-python
# independently: the grammar and the library share an ABI. The pairing
# 0.27 / 0.25 is verified by crates/trellis-index/tests/grammar_abi.rs.
[workspace.dependencies]
tree-sitter        = "0.27.0"
tree-sitter-python = "0.25.0"
llguidance         = "1.8.0"
# Line editing and history for the interactive session. Default
# features off: the extras are a fuzzy finder, a sqlite history
# backend and clipboard integration, none of which a task prompt needs.
rustyline          = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
# Compile-fail tests. The v0.2 gate asks for a *compile-fail* proof that
# `Verdict` cannot be forged; asserting it by inspection is not that.
trybuild           = "1.0.113"
# The v0.3 gate asks for a tamper-evident factual section. A 64-bit
# non-cryptographic hash would not be evidence of anything.
sha2               = "0.10.9"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.151"
schemars           = "1.2.2"
tokio              = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "net", "io-util", "signal"] }
rayon              = "1.12.0"
postcard           = { version = "1.1.3", features = ["use-std"] }
git2               = "0.21.0"
clap               = { version = "4.6.7", features = ["derive"] }
toml               = "1.1.6"
thiserror          = "2.0.20"
anyhow             = "1.0.104"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
smallvec           = { version = "1.16.1", features = ["serde", "union"] }
walkdir            = "2.5.0"
insta              = "1.48.0"
tempfile           = "3.17.1"

trellis-core   = { path = "crates/trellis-core" }
trellis-index  = { path = "crates/trellis-index" }
trellis-checks = { path = "crates/trellis-checks" }
trellis-model  = { path = "crates/trellis-model" }
trellis-loop   = { path = "crates/trellis-loop" }
trellis-trail  = { path = "crates/trellis-trail" }
trellis-vcs    = { path = "crates/trellis-vcs" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The shipped binary.
#
# `panic = "abort"` is deliberately NOT set, and it is the obvious thing to
# reach for. Unwinding is load-bearing here: `Snapshot::rollback` is proven
# against an induced panic with `catch_unwind`, and the TUI restores the
# terminal from `Drop` — neither survives an abort. A smaller binary is worth
# less than a failure path that still works.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
